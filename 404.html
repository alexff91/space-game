<!DOCTYPE html>
<html>
<head>
<script>
  const path = window.location.pathname;
  const search = window.location.search;
  const hash = window.location.hash;
  window.location.replace(
    window.location.origin + '/space-game/' +
    '?p=' + encodeURIComponent(path) + search + hash
  );
</script>
</head>
<body></body>
</html>
